[project]
name = "langgraphv1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "myriam2005", email = "myriam.kary@etudiant-fst.utm.tn" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-cli[inmem]>=0.4.33",
    "langsmith>=0.14.2",
    "python-dotenv>=1.2.3",
    "uuid-utils==0.12.0",
]

[project.scripts]
langgraphv1 = "langgraphv1:main"

[build-system]
